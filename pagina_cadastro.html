<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olho do Tempo - Cadastro</title>
    <!-- Importação do CSS Unificado da Aplicação -->
    <link rel="stylesheet" href="base.css">
</head>

<body>
    <main class="base">
        <!-- Logo da empresa alinhada com os estilos da tela de login inicial -->
        <img class="Logo" alt="Logo da Empresa" src="Imagens/LOGO.png">

        <!-- Container do cadastro com sobreposição z-index -->
        <div class="caixa-login" id="cardCadastro">
            <h2>Seja bem vindo!</h2>
            <p class="subtitulo">Cadastre-se Agora e participe da nossa comunidade!</p>

            <!-- Formulário com validações integradas -->
            <form id="formCadastro" autocomplete="off">

                <!-- Campo: Nome Completo -->
                <div class="grupo-input">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required
                        minlength="3">
                    <span class="mensagem-erro" id="erro-nome"></span>
                </div>

                <!-- Campo: E-mail -->
                <div class="grupo-input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                    <span class="mensagem-erro" id="erro-email"></span>
                </div>

                <!-- Campo: Senha -->
                <div class="grupo-input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required minlength="6"
                        autocomplete="new-password">
                    <span class="mensagem-erro" id="erro-senha"></span>
                </div>

                <!-- Campo: Confirmar Senha -->
                <div class="grupo-input">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha"
                        required autocomplete="new-password">
                    <span class="mensagem-erro" id="erro-confirmarSenha"></span>
                </div>

                <!-- Botão Principal de Cadastro -->
                <button type="submit" id="btnCadastrar">Cadastrar</button>
            </form>

            <!-- Link de retorno para a tela inicial -->
            <p class="Cadastro">Já tem uma conta? <a href="index.html" class="Link-Cadastro">Faça Login.</a></p>
        </div>

        <!-- MODAL DE CONFIRMAÇÃO DE SUCESSO (Aparece ao finalizar) -->
        <div class="modal-sucesso" id="modalSucesso" style="display: none;">
            <div class="icone-sucesso">✓</div>
            <h3>Cadastro Realizado!</h3>
            <p>Seu usuário foi registrado com sucesso.</p>
            <p class="texto-redirecionamento">Redirecionando para a tela de login em <b id="contador">3</b> segundos...
            </p>
        </div>

    </main>

    <footer class="rodape">
        <p>KishurDev © Todos os direitos reservados.</p>
    </footer>

    <!-- Script de validação e direcionamento -->
    <script type="module" src="telaCadastro.js"></script>
</body>

</html>
