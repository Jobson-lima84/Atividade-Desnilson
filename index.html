<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olho do Tempo</title>
    <link rel="stylesheet" href="Css/global.css">
    <link rel="stylesheet" href="Css/auth.css">
</head>

<body>
    <main class="base">

        <img src="Imagens/fundosite.jpg" alt="Imagem de Fundo" class="fundo">
        <img src="Imagens/LOGO.png" alt="Logo da Empresa" class="logo">
        
        <div class="caixa-login">

            <h2>Seja bem vindo!</h2>

            <form>
                <div class="grupo-input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu Email">
                </div>

                <div class="grupo-input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">

                    <p class="Esqueceu">Esqueceu a senha? <a href="esqueceu.html" class="Link-Esqueceu">Clique aqui.</a></p>
                    <button type="submit">Acessar</button>
                </div>
            </form>
            <div class="divisor">
                <span class="Separador">Login Social</span>
            </div>

            <div class="login-social">
                <a href="#" class="botao-social" title="Entrar com Goggle">
                    <img src="Imagens/google-color-svgrepo-com.svg" alt="Google">
                </a>

                <a href="#" class="botao-social" title="Entrar com Facebook">
                    <img src="Imagens/facebook-color-svgrepo-com.svg" alt="Facebook">
                </a>

                <a href="#" class="botao-social" title="Entrar com Instagram">
                    <img src="Imagens/instagram-1-svgrepo-com.svg" alt="Instagram">
                </a>
            </div>

            <p>Não tem uma conta? <a href="cadastro.html" class="Link-destaque">Cadastre-se.</a>
            </p>
        </div>
    </main>

    <footer class="rodape">
        <p>KishurDev © Todos os direitos reservados.</p>
    </footer>

</body>

</html>
