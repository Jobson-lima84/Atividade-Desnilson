<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="base.css">
    <script src="./home.js" defer></script>
</head>

<body class="home">

    <!-- Cabeçalho / Barra Superior -->
    <header class="cabecalho">
        <div class="nav-container">
            <a href="home.html" class="brand">
                <img src="Imagens/LOGO1.png" alt="Olho no Tempo Logo" class="logo-img">
            </a>
            <nav class="navegacao">
                <a href="home.html" class="nav-link ativo">Home</a>
                <a href="monitoramento.html" class="nav-link">Monitoramento</a>
                <a href="comunidade.html" class="nav-link">Comunidade</a>
            </nav>
        </div>
        <div class="usuario-acoes">
            <a href="index.html" id="btn-sair" class="nav-link btn-sair">Sair</a>
        </div>
    </header>

    <div class="card">
        <div class="search">
            <input type="text" class="search-bar" placeholder="Pesquisar">
            <button class="butao"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="clima carregando">
            <h2 class="cidade">Clima em Recife</h2>
            <h1 class="temp">35°C</h1>
            <div class="flex">
                <img src="https://openweathermap.org/img/wn/04d.png" alt="" class="icon" />
                <div class="descricao">Nublado</div>
            </div>
            <div class="umidade">Umidade: 60%</div>
            <div class="vento">Velocidade do Vento: 6.2 km/h</div>
        </div>
    </div>

    <footer class="rodape">
        <p>KishurDev © Todos os direitos reservados.</p>
    </footer>

</body>

</html>
