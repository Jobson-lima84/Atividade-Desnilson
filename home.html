<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="base.css">
    <script src="./home.js" defer></script>
</head>

<body class="home">
    <div class="card">
        <div class="search">
            <input type="text" class="search-bar" placeholder="Pesquisar">
            <button class="butao"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="clima carregando">
            <h2 class="cidade">Clima em Recife</h2>
            <h1 class="temp">35°C</h1>
            <div class="flex">
                <img src="https://openweathermap.org/img/wn/04d.png" alt="" class="icon" />
                <div class="descricao">Nublado</div>
            </div>
            <div class="umidade">Umidade: 60%</div>
            <div class="vento">Velocidade do Vento: 6.2 km/h</div>
        </div>
    </div>
</body>

</html>
