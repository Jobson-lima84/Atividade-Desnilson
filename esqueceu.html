<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olho do Tempo - Recuperar Senha</title>
    <link rel="stylesheet" href="Css/global.css">
    <link rel="stylesheet" href="Css/auth.css">
</head>
<body>
    <main class="base">
        <img src="Imagens/fundosite.jpg" alt="Imagem de Fundo" class="fundo">
        <img src="Imagens/LOGO2.png" alt="Logo da Empresa" class="logo">

        <div class="caixa-login">
            <h2>Redefinir a Senha</h2> 
            <p class="texto-denso">Para recuperar a sua senha, informe seu endereço de e-mail e nós enviaremos um link para a alteração da <strong>senha.</strong></p>

            <form>
                <div class="grupo-input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail cadastrado" required>
                </div>
                
                <button type="submit">Enviar</button>
            </form>

            <p>Voltar à tela de login? <a href="index.html" class="link-destaque">Faça login.</a></p>
        </div>
    </main>

    <footer class="rodape">
        <p>KishurDev © Todos os direitos reservados.</p> 
    </footer>
</body>
</html>
